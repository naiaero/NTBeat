<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar</title>
    <link rel="stylesheet" href="assets/style/style.css">
</head>
<body>
    <!-- halaman login -->
    <div class="login-out">
        <div class="login-in">
            <!-- bagian kiri -->
            <div class="login-left">
                <!-- logo ntbeat -->
                <div class="login-logo">
                    <img src="assets/img/logo.png" alt="">
                </div>
                <!-- tulisan ntbeat -->
                <div>
                    <h1>NTBeat</h1>
                </div>
            </div>
            <!-- bagian kanan -->
            <form>
                <h2>Selamat datang di NTBeat</h2>
                <label class="login-form">Nama</label> <br>
                <input type="text" class="login-box" placeholder="Lyodra Ginting" required> <br>

                <label class="login-form">Email</label> <br>
                <input type="email" class="login-box" placeholder="lily@gmail.com" required> <br>

                <label class="login-form">Password</label> <br>
                <input type="text" class="login-box" placeholder="lily04**" required> <br> <br>
                <button class="btn-login">Daftar</button>
            </form>
        </div>
    </div>
</body>
</html>
