<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar</title>
    <link rel="stylesheet" href="assets/style/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-header">
        <img src="assets/img/logo.png" alt="Logo NTBeat" class="header-logo" />
        <h1>NTBeat</h1>
      </div>

      <div class="auth-card">
        <h2>Register</h2>
        <p class="auth-subtitle">Lorem ipsum dolor sit amet hean</p>

        <form action="#">
            <div class="auth-form-group">
            <label for="email">Nama*</label>
            <input
              type="text"
              id="nama"
              class="auth-input"
              placeholder="Masukkan Nama "
              required
            />
          </div>

          <div class="auth-form-group">
            <label for="email">Email*</label>
            <input
              type="email"
              id="email"
              class="auth-input"
              placeholder="example@gmail.com "
              required
            />
          </div>

          <div class="auth-form-group">
            <div class="auth-label-row">
              <label for="password">Password*</label>
            </div>
            <input
              type="password"
              id="password"
              class="auth-input"
              placeholder="Masukkan password"
              required
            />
          </div>

          <button type="submit" class="auth-btn-submit">Register</button>
        </form>

        <p class="auth-footer">Sudah punya akun? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
