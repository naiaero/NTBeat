<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- halaman login -->
    <div class="login-out">
        <div class="login-in">
            <!-- bagian kiri -->
            <div class="login-left">
                <!-- logo ntbeat -->
                <div>
                    <img src="src/image/logo.png" alt="">
                </div>
                <!-- tulisan ntbeat -->
                <div>
                    <h1>NTBeat</h1>
                </div>
            </div>
            <!-- bagian kanan -->
            <div class="login-right">
                <h2>Selamat datang di NTBeat</h2>
                <input type="text" class="login-box" placeholder="username/email">
                <input type="text" class="login-box" placeholder="password">
                <button class="btn-login">Daftar</button>
            </div>
        </div>
    </div>
</body>
</html>
